services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /app/models/llama-3.2-3b-instruct-q4_k_m.gguf
    volumes:
      - ./backend/models:/app/models:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
